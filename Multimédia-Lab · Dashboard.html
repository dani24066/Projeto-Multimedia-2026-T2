<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro de comandos · Orbit Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap">
<style>
:root{--bg:#04060d;--bg2:#0a1226;--pn:rgba(10,18,38,.78);--line:#1d3a63;--cy:#4de3ff;--am:#ffb347;--tx:#d7e6ff;--mu:#8aa0c4;--ok:#5dffb0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--tx);font:500 16px/1.45 Rajdhani,"Segoe UI",system-ui,sans-serif;background:#04060d radial-gradient(ellipse at 15% 0%,#10224a 0,transparent 55%),radial-gradient(ellipse at 95% 100%,#2a1148 0,transparent 50%);background-attachment:fixed;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1px 1px at 12% 22%,#fff9,transparent 60%),radial-gradient(1px 1px at 78% 18%,#fff8,transparent 60%),radial-gradient(1.5px 1.5px at 44% 70%,#cfe9ff99,transparent 60%),radial-gradient(1px 1px at 88% 64%,#fff7,transparent 60%),radial-gradient(1px 1px at 30% 90%,#fff8,transparent 60%),radial-gradient(1.5px 1.5px at 62% 40%,#ffe9c88a,transparent 60%)}
button,select{font:inherit;color:var(--tx);cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(4,8,18,.78);backdrop-filter:blur(6px)}
.logo{font:700 18px Orbitron,sans-serif;letter-spacing:.2em;color:var(--cy);text-shadow:0 0 12px #4de3ff80;white-space:nowrap}.logo span{color:var(--am)}
.chip{font:600 11px Orbitron,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);border:1px solid var(--line);padding:5px 12px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);white-space:nowrap}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:8px;animation:pulso 2s infinite}
.sp{flex:1}
.btn{font:600 11px Orbitron,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:rgba(77,227,255,.08);border:1px solid var(--cy);color:var(--cy);padding:8px 14px;min-height:36px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);white-space:nowrap}
.btn:hover{background:rgba(77,227,255,.24)}
.rail{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 6px;border-right:1px solid var(--line);background:rgba(4,8,18,.6);overflow:auto}
.pl{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:var(--mu);font:600 10px Orbitron,sans-serif;letter-spacing:.08em;text-transform:uppercase;width:84px;text-align:center}
.pl i{width:46px;height:46px;border-radius:50%;background:var(--c);box-shadow:inset -7px -7px 14px rgba(0,0,0,.5),0 0 0 2px transparent;transition:box-shadow .2s}
.pl:hover i,.pl[aria-current=page] i{box-shadow:inset -7px -7px 14px rgba(0,0,0,.5),0 0 0 2px var(--bg),0 0 0 4px var(--cy),0 0 20px #4de3ff90}
.pl[aria-current=page]{color:var(--cy)}
.main{min-height:0;overflow:auto;padding:14px}
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center;max-width:1180px;margin:0 auto;min-height:100%}
.kick{font:600 11px Orbitron,sans-serif;letter-spacing:.3em;color:var(--mu);text-transform:uppercase;margin:0}
.hero h1{font:700 clamp(2.2rem,6vw,3.8rem)/1 Orbitron,sans-serif;letter-spacing:.12em;margin:10px 0 14px;text-shadow:0 0 28px #4de3ff55}.hero h1 b{color:var(--am)}
.hero p.l{color:var(--mu);font-size:1.15rem;max-width:34ch;margin:0}
.orb{position:relative;width:min(340px,78%);aspect-ratio:1;margin-top:28px}
.ring{position:absolute;border:1px dashed #2a4a7a;border-radius:50%;animation:giro linear infinite}
.r1{inset:0;animation-duration:50s}.r2{inset:16%;animation-duration:32s;animation-direction:reverse}.r3{inset:32%;animation-duration:20s}
.ring i{position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.sun{position:absolute;inset:44%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#ffb347 60%,#c2571a);box-shadow:0 0 40px #ffb34780}
@keyframes giro{to{transform:rotate(360deg)}}@keyframes pulso{50%{opacity:.3}}
.cards{display:grid;gap:14px}
.mc{display:grid;gap:6px;text-align:left;padding:16px 20px;background:var(--pn);border:1px solid var(--line);clip-path:polygon(0 14px,14px 0,100% 0,100% 100%,0 100%);transition:background .2s,border-color .2s}
.mc:hover{border-color:var(--cy);background:rgba(77,227,255,.08)}
.mc small{font:600 10px Orbitron,sans-serif;letter-spacing:.2em;color:var(--am)}
.mc h2{margin:0;font:700 18px Orbitron,sans-serif;letter-spacing:.06em}.mc p{margin:0;color:var(--mu)}
.tg{display:flex;gap:6px;flex-wrap:wrap}.tg span{font:600 10px Orbitron,sans-serif;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:2px 8px;color:var(--mu)}
#work{height:100%;display:grid;grid-template-columns:1fr;gap:12px}#work.two{grid-template-columns:1fr 1fr}
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--line);clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.panel[hidden],[hidden]{display:none!important}
.ph{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);font:700 11px Orbitron,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.ph select{font:600 13px Rajdhani,sans-serif;background:var(--bg2);border:1px solid var(--line);padding:5px 8px;min-height:34px}
.pf{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0c1224}
@media(max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:60px minmax(0,1fr) 84px}
  .rail{grid-row:3;grid-column:1;flex-direction:row;justify-content:center;border-right:0;border-top:1px solid var(--line);padding:8px}
  .pl{width:76px}.pl i{width:36px;height:36px}.main{grid-row:2;grid-column:1}
  .home{grid-template-columns:1fr}#work.two{grid-template-columns:1fr}.hide{display:none}.orb{display:none}
}
@media(prefers-reduced-motion:reduce){.ring,.led{animation:none}}
</style>
</head>

<header class="top">

</header>
<nav class="rail" id="rail" aria-label="Módulos"></nav>
<main class="main">
  <section id="home" class="home">
    <div class="hero"><p class="kick">Centro de comandos</p><h1>MULTI<b>·LAB</b></h1>

      <div class="orb" aria-hidden="true"><div class="ring r1"><i style="--c:#4de3ff"></i></div><div class="ring r2"><i style="--c:#ff8a4d"></i></div><div class="ring r3"><i style="--c:#a97bff"></i></div><div class="sun"></div></div></div>
    <div class="cards" id="cards"></div>
  </section>
  <section id="work" hidden>
    <div class="panel" id="pA"><div class="ph"><span class="led"></span><span id="pAt"></span><div class="sp"></div><select id="pAs" aria-label="Módulo do painel A"></select></div><div class="pf" id="pAf"></div></div>
    <div class="panel" id="pB" hidden><div class="ph"><span class="led"></span><span id="pBt"></span><div class="sp"></div><select id="pBs" aria-label="Módulo do painel B"></select></div><div class="pf" id="pBf"></div></div>
  </section>
</main>
</div>

const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
let tema="dark",nl=1,mb="ecra";const F={A:{},B:{}};

/* navegação lateral e cartões */
[{id:"home",s:"Início",c:"radial-gradient(circle at 35% 35%,#fff3c4,#ffb347 60%,#c2571a)"},...APPS].forEach(a=>{
  const b=el("button",null,"pl"),i=el("i");i.style.setProperty("--c",a.c);b.dataset.id=a.id;b.append(i,el("span",a.s));b.onclick=()=>{location.hash=a.id};$("rail").append(b)});
APPS.forEach((a,k)=>{const b=el("button",null,"mc");b.append(el("small","MÓDULO 0"+(k+1)),el("h2",a.n),el("p",a.d));
  const tg=el("div",null,"tg");a.t.forEach(x=>tg.append(el("span",x)));b.append(tg);b.onclick=()=>{location.hash=a.id};$("cards").append(b)});
["pAs","pBs"].forEach(s=>APPS.forEach(a=>{const o=el("option",a.n);o.value=a.id;$(s).append(o)}));

/* painéis com os widgets (cada widget mantém o seu estado ao mudar de módulo) */
function sync(f){try{f.contentDocument.documentElement.dataset.theme=tema}catch(e){}}
function mount(p,id){const host=$("p"+p+"f"),a=APPS.find(x=>x.id===id);
  if(!F[p][id]){const f=document.createElement("iframe");f.title=a.n;f.allow="clipboard-write";f.addEventListener("load",()=>sync(f));f.srcdoc=dec(DATA[id]);host.append(f);F[p][id]=f}
  Object.entries(F[p]).forEach(([k,f])=>f.hidden=k!==id);
  $("p"+p+"s").value=id;$("p"+p+"t").textContent="Módulo 0"+(APPS.indexOf(a)+1)+" · "+a.n}
function route(){
  const id=location.hash.slice(1),a=APPS.find(x=>x.id===id);
  $("home").hidden=!!a;$("work").hidden=!a;
  document.querySelectorAll(".pl").forEach(b=>{if(b.dataset.id===(a?id:"home"))b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  document.title=(a?a.n:"Centro de comandos")+" · Orbit Lab";
  if(!a)return;
  mount("A",id);$("pB").hidden=nl!==2;$("work").classList.toggle("two",nl===2);
  if(nl===2){if(mb===id)mb=APPS.find(x=>x.id!==id).id;mount("B",mb)}
}
$("pAs").onchange=e=>{location.hash=e.target.value};
$("pBs").onchange=e=>{mb=e.target.value;route()};
$("lay").onclick=()=>{nl=nl===1?2:1;$("lay").textContent="Vista: "+(nl===1?"1 painel":"2 painéis");route()};
$("tem").onclick=()=>{tema=tema==="dark"?"light":"dark";$("tem").textContent="Widgets: "+(tema==="dark"?"escuro":"claro");document.querySelectorAll("iframe").forEach(sync)};
const tick=()=>{$("clk").textContent=new Date().toLocaleTimeString("pt-PT")};tick();setInterval(tick,1000);
addEventListener("hashchange",route);route();
</script>
